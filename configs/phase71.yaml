seed: 17
test_fraction: 0.20
outer_cv_folds: 5
calibration_cv_folds: 3
calibration_method: sigmoid

max_text_features: 3000
min_ngram: 1
max_ngram: 2
logistic_c: 1.0

# Route thresholds are chosen only from development out-of-fold predictions.
target_safe_precision: 0.80
min_route_threshold_coverage: 0.01
min_enabled_routes: 2

# These checks are applied once to the untouched combined-policy holdout.
min_policy_coverage: 0.05
min_routed_holdout_examples: 3
min_gross_latency_reduction: 0.005
max_expected_calibration_error: 0.15
max_brier_score: 0.20
calibration_bins: 10
