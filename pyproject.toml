[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptivedepth"
version = "0.1.0"
description = "Risk-aware adaptive transformer depth experiments"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "torch>=2.2",
  "transformers>=4.46,<6",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "scikit-learn>=1.4,<2"]
data = ["datasets>=3.0"]
router = ["scikit-learn>=1.4,<2"]

[project.scripts]
adaptivedepth = "adaptivedepth.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
